name: Construire l'APK Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accepter les licences Android (le SDK est déjà installé sur le serveur)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Préparer les fichiers de l'app
        run: |
          mkdir -p www assets
          cp index.html manifest.json service-worker.js icon-192.png icon-512.png www/
          cp app-icon.png assets/icon-only.png
          cp app-icon-fg.png assets/icon-foreground.png
          cp app-icon-bg.png assets/icon-background.png
          cp app-splash.png assets/splash.png
          cp app-splash.png assets/splash-dark.png

      - name: Installer Capacitor
        run: npm install

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android || echo "Icônes : étape ignorée"

      - name: Réglages Android (permissions)
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ['POST_NOTIFICATIONS', 'SCHEDULE_EXACT_ALARM', 'RECEIVE_BOOT_COMPLETED',
                   'RECORD_AUDIO', 'MODIFY_AUDIO_SETTINGS', 'ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION']
          add = ''.join('    <uses-permission android:name="android.permission.%s" />\n' % x
                        for x in perms if ('android.permission.%s"' % x) not in s)
          s = s.replace('</manifest>', add + '</manifest>')
          open(p, 'w', encoding='utf-8').write(s)
          v = 'android/variables.gradle'
          t = open(v, encoding='utf-8').read()
          t = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 34', t)
          open(v, 'w', encoding='utf-8').write(t)
          # son : autoriser la lecture audio sans nouveau toucher (sinon certains versets ne se lancent pas)
          import os
          act = 'android/app/src/main/java/app/kuranikerim/MainActivity.java'
          if os.path.exists(act):
              java = ['package app.kuranikerim;', '', 'import com.getcapacitor.BridgeActivity;', '',
                      'public class MainActivity extends BridgeActivity {',
                      '    @Override',
                      '    public void onStart() {',
                      '        super.onStart();',
                      '        try {',
                      '            this.bridge.getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);',
                      '        } catch (Exception e) { }',
                      '    }',
                      '    @Override',
                      '    public void onPause() {',
                      '        super.onPause();',
                      '        try {',
                      '            this.bridge.getWebView().onResume();',
                      '            this.bridge.getWebView().resumeTimers();',
                      '        } catch (Exception e) { }',
                      '    }',
                      '}', '']
              open(act, 'w', encoding='utf-8').write('\n'.join(java))
              print('MainActivity : lecture audio sans geste OK')
          # écran de démarrage Android : même fond que l'icône et logo rond bien centré
          import os, shutil
          os.makedirs('android/app/src/main/res/drawable-xxxhdpi', exist_ok=True)
          shutil.copy('app-splash-icon.png', 'android/app/src/main/res/drawable-xxxhdpi/splash_icon.png')
          sp = 'android/app/src/main/res/values/styles.xml'
          x = open(sp, encoding='utf-8').read()
          m = re.search(r'(<style name="AppTheme\.NoActionBarLaunch"[^>]*>)(.*?)(</style>)', x, re.S)
          if m and 'Theme.SplashScreen' in m.group(1):
              body = re.sub(r'\s*<item name="windowSplashScreen(Background|AnimatedIcon)">.*?</item>', '', m.group(2))
              body += '\n        <item name="windowSplashScreenBackground">#F6F9F7</item>\n        <item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>\n    '
              x = x[:m.start()] + m.group(1) + body + m.group(3) + x[m.end():]
              open(sp, 'w', encoding='utf-8').write(x)
              print('splash: styles.xml mis a jour')
          else:
              print('splash: theme inattendu, etape ignoree')
          PY
          npx cap sync android

      - name: Utiliser toujours la même clé de signature (pour que les mises à jour s'installent par-dessus)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Nommer le fichier
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kuran-i-Kerim.apk

      - name: Garder l'APK (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Kuran-i-Kerim-apk
          path: Kuran-i-Kerim.apk

      - name: Publier l'APK (lien à télécharger)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Kur'an-ı Kerim (version ${{ github.run_number }})"
          files: Kuran-i-Kerim.apk
